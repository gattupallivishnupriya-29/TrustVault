
<!DOCTYPE html>
<html>
<head>
    <title>Upload Document - TrustVault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #263b63;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #263b63;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Upload Document</h2>

        <form method="POST"
              action="{{ url_for('upload_document') }}"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Document Title</label>
            <input type="text" name="title"
                   placeholder="Enter document title" required>

            <label>Category</label>
            <input type="text" name="category"
                   placeholder="Example: Personal" required>

            <label>Select Document</label>
            <input type="file" name="document"
                   accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg"
                   required>

            <button type="submit">Upload Document</button>
        </form>

        <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
    </div>
</body>
</html>
