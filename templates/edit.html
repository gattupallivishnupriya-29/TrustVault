<!DOCTYPE html>
<html>
<head>
    <title>Edit Document - TrustVault</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #263b63;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Document</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <p>
        <strong>Original Filename:</strong>
        {{ document.original_filename }}
    </p>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>Document Title:</label>

        <input
            type="text"
            name="title"
            value="{{ document.title }}"
            maxlength="200"
            required
        >

        <button type="submit">
            Update Document
        </button>

    </form>

    <br>

    <a href="{{ url_for('documents') }}">
        Back to Documents
    </a>

</div>

</body>
</html>
