
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Login</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2f7;
            text-align: center;
            padding-top: 60px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
        }

        button {
            background: #174ea6;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
        }

        a {
            color: #174ea6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>TrustVault</h1>
    <h3>User Login</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <input type="text" name="identity"
               placeholder="Username or Email" required>

        <input type="password" name="password"
               placeholder="Enter password" required>

        <br>

        <button type="submit">Login</button>

    </form>

    <p>Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>

</div>

</body>
</html>
